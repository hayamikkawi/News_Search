services:
  ttds-db:
    image: mysql:8.0
    container_name: ttds_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ttds#123
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./scripts:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password