[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "web-searcher-crawler"
version = "0.1.0"
description = "Web Searcher Crawler - RSS feed crawler and content extractor"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "TTDS Team", email = "s2795693@deu.ac.uk"}
]
keywords = ["crawler", "rss", "web-scraping", "content-extraction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "feedparser",
    "requests",
    "trafilatura",
    "python-dateutil",
    "pyyaml",
    "mysql-connector-python",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "ruff>=0.0.200",
]

[project.scripts]
crawler = "src.cli.main:main"
crawler-full = "src.cli.main_with_coordinator:main"

[tool.setuptools]
packages = ["src", "src.core", "src.storage", "src.integration", "src.cli"]

[tool.setuptools.package-data]
sources = ["*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
