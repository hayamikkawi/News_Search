services:
  # MySQL Database Service
  ttds-db:
    image: mysql:8.0
    container_name: ttds_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ttds#123
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./scripts:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - ttds-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Crawler Scheduler Service
  ttds-crawler:
    image: python:3.11
    container_name: ttds_crawler
    restart: always
    working_dir: /app
    volumes:
      # Mount crawler code (enables live config updates)
      - ./crawler:/app:ro
      # Mount shared JSON output directory (read-write)
      - ./shared/indexer/input:/indexer/input
      # Mount log file for persistence (optional)
      - ./shared/logs:/logs
      # Cache pip packages to speed up restarts
      - pip-cache:/root/.cache/pip
    environment:
      # MySQL Configuration
      MYSQL_HOST: ttds-db
      MYSQL_PORT: 3306
      MYSQL_USER: ttds_app
      MYSQL_PASSWORD: ttds#123
      MYSQL_DATABASE: ttds_search_engine
      MYSQL_POOL_SIZE: 5

      # Crawler Behavior Configuration
      MAX_ITEMS_PER_FEED: 20
      CRAWLER_TIMEOUT_SECONDS: 15
      CRAWLER_SLEEP_SECONDS: 1.0
      CRAWLER_JITTER_SECONDS: 0.5
      MIN_TEXT_LENGTH: 400

      # Indexer Configuration
      INDEXER_OUTPUT_DIR: /indexer/input
      INDEXER_OUTPUT_FILENAME: docs.json
      INDEXER_FLUSH_MODE: new_file
      INDEXER_DEDUP_THRESHOLD_MB: 100
      SAVE_CONTENT_TO_DB: "false"

      # Timezone
      TZ: Europe/London

      # Logging
      LOG_DIR: /logs

      # Python settings
      PYTHONUNBUFFERED: 1
      PYTHONIOENCODING: utf-8
    command: >
      bash -c "
      echo '=== Installing Python dependencies ===' &&
      pip install --no-cache-dir -r requirements.txt &&
      echo '=== Starting Crawler Scheduler ===' &&
      python scheduler.py
      "
    depends_on:
      ttds-db:
        condition: service_healthy
    networks:
      - ttds-network
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[p]ython scheduler.py' || exit 1"]
      interval: 120s
      timeout: 10s
      retries: 5
      start_period: 300s

  # IR Service (REST API)
  ttds-ir:
    build:
      context: .
      dockerfile: IR/dockerfile
    container_name: ttds_ir
    restart: always
    ports:
      - "8000:8000"
    volumes:
      # Mount shared indexer output (read-only)
      - ./shared/indexer/output:/opt/ttds-project/shared/indexer/output:ro./shared/indexer/output:/opt/ttds-project/shared/indexer/output
      # Mount IR code for development (optional, remove in production)
      - ./IR:/app/IR:ro
      - ./common_utils:/app/common_utils:ro
    environment:
      # Database Configuration
      DB_HOST: ttds-db
      DB_PORT: 3306
      DB_USER: ttds_app
      DB_PASSWORD: ttds#123
      DB_NAME: ttds_search_engine

      # Index Configuration
      INDEX_BASE_DIR: /opt/ttds-project/shared/indexer/output
      INDEX_FILENAME: index.txt
      DOCS_STAT_FILENAME: documents_stats.json

      # CORS Configuration
      FRONTEND_ORIGIN: http://localhost

      # Python settings
      PYTHONUNBUFFERED: 1
    depends_on:
      ttds-db:
        condition: service_healthy
    networks:
      - ttds-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # UI Service
  ttds-ui:
    image: nginx:alpine
    container_name: ttds_ui
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend/GlobalSearch.html:/usr/share/nginx/html/GlobalSearch.html:ro
      - ./frontend/css:/usr/share/nginx/html/css:ro
      - ./frontend/js:/usr/share/nginx/html/js:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ttds-db
      - ttds-ir
    networks:
      - ttds-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/GlobalSearch.html"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  ttds-network:
    driver: bridge

volumes:
  pip-cache:
    driver: local
