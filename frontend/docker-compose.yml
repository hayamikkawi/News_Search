services:
  ttds-db:
    image: mysql:8.0
    container_name: ttds_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ttds#123
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./scripts:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - ttds-network

  ttds-frontend:
    image: nginx:alpine
    container_name: ttds_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend/GlobalSearch.html:/usr/share/nginx/html/GlobalSearch.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ttds-db
    networks:
      - ttds-network

networks:
  ttds-network:
    driver: bridge
